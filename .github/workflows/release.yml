name: Build and publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Check version tag and expose version
        id: app_version
        shell: pwsh
        run: |
          $version = python -c "from cnc_program_sheet.version import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME.TrimStart('v') -ne $version) { throw "Git tag must be v$version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Run tests
        run: python -m pytest -q
      - name: Configure release update source
        run: python scripts/set_release_repository.py $env:GITHUB_REPOSITORY
      - name: Build application
        shell: pwsh
        run: |
          $pythonDir = Split-Path (Get-Command python).Source
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$pythonDir"
          python -m PyInstaller --noconfirm --clean --distpath build/dist --workpath build/work cnc_program_sheet.spec
      - name: Verify packaged application self-check
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP "cnc-program-sheet-self-check.txt"
          $env:CNC_PROGRAM_SHEET_SELF_CHECK_MARKER = $marker
          $application = (Resolve-Path "build/dist/CNCProgramSheet/CNCProgramSheet.exe").Path
          $process = Start-Process -FilePath $application -ArgumentList "--self-check" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Packaged application self-check failed with exit code $($process.ExitCode)." }
          if (!(Test-Path -LiteralPath $marker) -or (Get-Content -Raw -LiteralPath $marker) -notmatch "ok") {
            throw "Packaged application did not complete its resource self-check."
          }
      - name: Build setup installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.app_version.outputs.version }}" installer.iss
      - name: Create checksum and updater manifest
        id: installer
        shell: pwsh
        run: |
          $version = "${{ steps.app_version.outputs.version }}"
          $installerName = "CNCProgramSheet_${version}_Setup_x64.exe"
          $installer = Join-Path (Resolve-Path build/installer).Path $installerName
          if (!(Test-Path -LiteralPath $installer)) { throw "The setup installer is missing." }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash *$installerName" | Set-Content build/installer/SHA256SUMS.txt -NoNewline
          @{
            version = $version
            installer_name = $installerName
            notes = "新增：可在设置中选择点击窗口 X 时直接退出或缩小到隐藏图标区。"
          } | ConvertTo-Json -Compress | Set-Content build/installer/CNCProgramSheet_update.json -NoNewline -Encoding utf8
          "path=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CNC程序单自动生成工具-v${{ steps.app_version.outputs.version }}
          path: build/installer/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "v${{ steps.app_version.outputs.version }}" "${{ steps.installer.outputs.path }}" "build/installer/SHA256SUMS.txt" "build/installer/CNCProgramSheet_update.json" --title "v${{ steps.app_version.outputs.version }}" --generate-notes
      - name: Retain the three newest releases
        uses: actions/github-script@v8
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const normalReleases = releases
              .filter((release) => !release.draft && !release.prerelease)
              .sort((left, right) => new Date(right.published_at) - new Date(left.published_at));
            for (const release of normalReleases.slice(3)) {
              core.info(`Deleting old GitHub Release ${release.tag_name} (${release.id})`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
            }
