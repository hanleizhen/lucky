name: Retain recent releases

on:
  push:
    branches: [main]
  workflow_dispatch:

# Release assets are outside Git history. Keep the three newest normal
# releases available for rollback, and remove only older Release records and
# their assets. Tags and source commits deliberately remain untouched.
permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the three newest releases
        uses: actions/github-script@v8
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const normalReleases = releases
              .filter((release) => !release.draft && !release.prerelease)
              .sort((left, right) => new Date(right.published_at) - new Date(left.published_at));
            for (const release of normalReleases.slice(3)) {
              core.info(`Deleting old GitHub Release ${release.tag_name} (${release.id})`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
            }
