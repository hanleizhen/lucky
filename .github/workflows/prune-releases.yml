name: Retain recent releases

on:
  push:
    branches: [main]
  workflow_dispatch:

# Release assets are outside Git history. Keep the three newest normal
# releases available for rollback, and remove only older Release records and
# their assets. Tags and source commits deliberately remain untouched.
permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the three newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          old_release_ids="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq 'map(select(.draft == false and .prerelease == false)) | sort_by(.published_at) | reverse | .[3:][] | .id')"
          for release_id in ${old_release_ids}; do
            echo "Deleting old GitHub Release ${release_id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          done
